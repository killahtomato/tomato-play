name: lint

on:
  push:
    branches: [main]
  pull_request:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run shellcheck
        # Error severity only: Tomato Play intentionally relies on GNU-isms and
        # loose word splitting (player flags, curl args), so info/warning
        # findings are expected and non-blocking here.
        run: |
          shellcheck --version
          shellcheck --shell=sh --severity=error tomatoplay